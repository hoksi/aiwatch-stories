# Jekyll 기본 minima 테마 (GitHub Pages 지원)
theme: minima
lang: ko

# Author
author:
  name: hoksi & Gemma3 4B
  email: hoksi@forbiz.co.kr

# Minima 설정
minima:
  skin: auto  # dark 모드 자동 대응
  date_format: "%Y년 %m월 %d일"

# 빌드 설정
markdown: kramdown
